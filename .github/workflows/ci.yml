name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Baixar dependências
        run: go mod download

      - name: Verificar formatação
        run: test -z "$(gofmt -l .)"

      - name: Análise estática
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Testes
        run: go test ./...
